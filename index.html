<script>
'use strict';
var lastStderr = '';

// ---------------------------------------------------------------------------
// Execution engine: every run happens inside a Web Worker. If the code hangs
// (infinite loop, blocking call), the worker is terminated on timeout, so the
// page can never freeze. This replaces the old Promise.race approach, which
// could not interrupt code already running on the main thread.
// ---------------------------------------------------------------------------
var PYODIDE_CDN = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';
var PYTHON_TIMEOUT_MS = 60000;
var JS_TIMEOUT_MS = 10000;

// ---------------------------------------------------------------------------
// Python prelude, installed inside Pyodide before user code runs.
// Pyodide has no sockets: its urllib ships without any HTTP handlers
// (urlopen dies with "unknown url type: https") and requests is not
// importable. The prelude routes both through the browser's own network
// stack via a synchronous XMLHttpRequest bridge living in the worker
// (sync XHR is allowed in workers). CORS still applies: a site that does
// not send Access-Control-Allow-Origin cannot be fetched, and the error
// messages say so instead of blaming the user's code.
// Written without backslashes/backticks on purpose (template literal).
// ---------------------------------------------------------------------------
var PY_PRELUDE = `
import sys as _cr_sys
import json as _cr_json

try:
    from js import __crXhrFetch as _cr_xhr
except Exception:
    _cr_xhr = None

_CR_CORS_HINT = ('The browser blocked the request before a usable response came back. '
                 'This usually means the target site does not allow requests from web '
                 'pages (missing CORS permission), the address is wrong, or the '
                 'connection dropped. It is not a bug in your code.')

def _cr_fetch(method, url, headers=None, body=None):
    if _cr_xhr is None:
        raise OSError('Networking is not available in this Python session.')
    raw = _cr_xhr(method, url, _cr_json.dumps(headers or {}), body)
    return _cr_json.loads(raw)

def _cr_parse_headers(raw):
    headers = {}
    for line in (raw or '').splitlines():
        if ': ' in line:
            k, v = line.split(': ', 1)
            headers[k.strip()] = v.strip()
    return headers

def _cr_has_ct(hdrs):
    return any(k.lower() == 'content-type' for k in hdrs)

# ---------------- requests (browser bridge implementation) ----------------
try:
    import requests as _cr_real_requests
except Exception:
    _cr_real_requests = None

if _cr_real_requests is None:
    import types as _cr_types
    import urllib.parse as _cr_uparse

    class _CrRequestException(IOError):
        pass
    class _CrConnectionError(_CrRequestException):
        pass
    class _CrHTTPError(_CrRequestException):
        pass
    class _CrTimeout(_CrRequestException):
        pass
    _CrRequestException.__name__ = 'RequestException'
    _CrConnectionError.__name__ = 'ConnectionError'
    _CrHTTPError.__name__ = 'HTTPError'
    _CrTimeout.__name__ = 'Timeout'

    class _CrResponse(object):
        def __init__(self, url, status, reason, headers, text):
            self.url = url
            self.status_code = status
            self.reason = reason
            self.headers = headers
            self.text = text
            self.encoding = 'utf-8'
        @property
        def content(self):
            return self.text.encode('utf-8', 'replace')
        @property
        def ok(self):
            return self.status_code < 400
        def json(self, **kw):
            return _cr_json.loads(self.text)
        def raise_for_status(self):
            if 400 <= self.status_code < 600:
                raise _CrHTTPError(str(self.status_code) + ' ' + str(self.reason) + ' for url: ' + self.url)
        def __repr__(self):
            return '<Response [' + str(self.status_code) + ']>'

    def _cr_requests_request(method, url, params=None, data=None, json=None, headers=None, timeout=None, **kw):
        hdrs = dict(headers or {})
        if params:
            qs = _cr_uparse.urlencode(params, doseq=True)
            url = url + ('&' if '?' in url else '?') + qs
        body = None
        if json is not None:
            body = _cr_json.dumps(json)
            if not _cr_has_ct(hdrs):
                hdrs['Content-Type'] = 'application/json'
        elif data is not None:
            if isinstance(data, dict):
                body = _cr_uparse.urlencode(data, doseq=True)
                if not _cr_has_ct(hdrs):
                    hdrs['Content-Type'] = 'application/x-www-form-urlencoded'
            elif isinstance(data, bytes):
                body = data.decode('utf-8', 'replace')
            else:
                body = str(data)
        r = _cr_fetch(method.upper(), url, hdrs, body)
        if r.get('status', 0) == 0:
            detail = r.get('error') or 'network error'
            raise _CrConnectionError('Failed to fetch ' + url + ' (' + detail + '). ' + _CR_CORS_HINT)
        return _CrResponse(url, r['status'], r.get('statusText', ''), _cr_parse_headers(r.get('headers')), r.get('body', ''))

    def _cr_mreq(method):
        def _f(url, **kw):
            return _cr_requests_request(method, url, **kw)
        return _f

    class _CrSession(object):
        def __init__(self):
            self.headers = {}
            self.cookies = {}
        def request(self, method, url, **kw):
            h = dict(self.headers)
            h.update(kw.pop('headers', None) or {})
            return _cr_requests_request(method, url, headers=h, **kw)
        def get(self, url, **kw):
            return self.request('GET', url, **kw)
        def post(self, url, **kw):
            return self.request('POST', url, **kw)
        def put(self, url, **kw):
            return self.request('PUT', url, **kw)
        def delete(self, url, **kw):
            return self.request('DELETE', url, **kw)
        def head(self, url, **kw):
            return self.request('HEAD', url, **kw)
        def close(self):
            pass
        def __enter__(self):
            return self
        def __exit__(self, *a):
            return False

    _cr_req_mod = _cr_types.ModuleType('requests')
    _cr_req_mod.request = _cr_requests_request
    _cr_req_mod.get = _cr_mreq('GET')
    _cr_req_mod.post = _cr_mreq('POST')
    _cr_req_mod.put = _cr_mreq('PUT')
    _cr_req_mod.delete = _cr_mreq('DELETE')
    _cr_req_mod.head = _cr_mreq('HEAD')
    _cr_req_mod.options = _cr_mreq('OPTIONS')
    _cr_req_mod.patch = _cr_mreq('PATCH')
    _cr_req_mod.Session = _CrSession
    _cr_req_exc = _cr_types.ModuleType('requests.exceptions')
    _cr_req_exc.RequestException = _CrRequestException
    _cr_req_exc.ConnectionError = _CrConnectionError
    _cr_req_exc.HTTPError = _CrHTTPError
    _cr_req_exc.Timeout = _CrTimeout
    _cr_req_exc.ConnectTimeout = _CrTimeout
    _cr_req_exc.ReadTimeout = _CrTimeout
    _cr_req_mod.exceptions = _cr_req_exc
    _cr_sys.modules['requests'] = _cr_req_mod
    _cr_sys.modules['requests.exceptions'] = _cr_req_exc

# ---------------- urllib.request (working urlopen) ----------------
import io as _cr_io
import email.message as _cr_emsg
import urllib.request as _cr_ureq
import urllib.error as _cr_uerr

class _CrUrlResponse(_cr_io.BytesIO):
    def __init__(self, url, status, reason, headers, body_bytes):
        _cr_io.BytesIO.__init__(self, body_bytes)
        self.url = url
        self.status = status
        self.code = status
        self.reason = reason
        self._headers_raw = headers
        msg = _cr_emsg.Message()
        for k, v in headers.items():
            msg[k] = v
        self.headers = msg
        self.msg = msg
    def getcode(self):
        return self.status
    def geturl(self):
        return self.url
    def info(self):
        return self.headers
    def getheaders(self):
        return list(self._headers_raw.items())
    def getheader(self, name, default=None):
        for k, v in self._headers_raw.items():
            if k.lower() == str(name).lower():
                return v
        return default

def _cr_urlopen(url, data=None, timeout=None, **kw):
    full_url = url
    method = None
    hdrs = {}
    body = data
    if hasattr(url, 'full_url'):
        req = url
        full_url = req.full_url
        method = req.get_method()
        hdrs = dict(req.header_items())
        if body is None:
            body = req.data
    if method is None:
        method = 'POST' if body is not None else 'GET'
    body_text = None
    if isinstance(body, bytes):
        body_text = body.decode('utf-8', 'replace')
    elif body is not None:
        body_text = str(body)
    if body_text is not None and not _cr_has_ct(hdrs):
        hdrs['Content-Type'] = 'application/x-www-form-urlencoded'
    r = _cr_fetch(method, full_url, hdrs, body_text)
    if r.get('status', 0) == 0:
        detail = r.get('error') or 'network error'
        raise _cr_uerr.URLError('Failed to fetch ' + full_url + ' (' + detail + '). ' + _CR_CORS_HINT)
    headers = _cr_parse_headers(r.get('headers'))
    resp = _CrUrlResponse(full_url, r['status'], r.get('statusText', ''), headers, (r.get('body') or '').encode('utf-8', 'replace'))
    if r['status'] >= 400:
        raise _cr_uerr.HTTPError(full_url, r['status'], r.get('statusText') or 'HTTP error', resp.headers, resp)
    return resp

_cr_ureq.urlopen = _cr_urlopen
`;

var pythonWorkerSrc = [
  "importScripts('" + PYODIDE_CDN + "');",
  "var PY_PRELUDE = " + JSON.stringify(PY_PRELUDE) + ";",
  "var pyodideReady = null;",
  "var preludeDone = false;",
  "var PACKAGE_ALIASES = { PIL: 'Pillow', cv2: 'opencv-python', yaml: 'pyyaml', sklearn: 'scikit-learn' };",
  "self.__crXhrFetch = function(method, url, headersJson, bodyText) {",
  "  var result = { status: 0, statusText: '', headers: '', body: '', error: '' };",
  "  try {",
  "    var xhr = new XMLHttpRequest();",
  "    xhr.open(method, url, false);",
  "    var hdrs = {};",
  "    try { hdrs = JSON.parse(headersJson || '{}'); } catch (e) {}",
  "    for (var k in hdrs) { try { xhr.setRequestHeader(k, String(hdrs[k])); } catch (e) {} }",
  "    xhr.send(bodyText === undefined || bodyText === null ? null : bodyText);",
  "    result.status = xhr.status || 0;",
  "    result.statusText = xhr.statusText || '';",
  "    try { result.headers = xhr.getAllResponseHeaders() || ''; } catch (e) {}",
  "    try { result.body = xhr.responseText || ''; } catch (e) {}",
  "  } catch (e) {",
  "    result.error = String((e && e.message) || e);",

  "  return JSON.stringify(result);",
  "};",
  "function ensurePyodide() {",
  "  if (!pyodideReady) {",
  "    pyodideReady = loadPyodide().then(function(py) {",
  "      return py.loadPackage('sqlite3').then(function() { return py; }, function() { return py; });",
  "    });",
  "  }",
  "  return pyodideReady;",

  "    py.setStdout({ batched: function(s) { stdout += s + '\\n'; } });",
  "    py.setStderr({ batched: function(s) { stderr += s + '\\n'; } });",

  "    try { p = py.runPythonAsync(code); }",

  "    catch (err) { notes.push('Note: the browser networking setup failed to load (' + String((err && err.message) || err).slice(0, 160) + '), so requests/urllib may be unavailable in this session.'); }",
  "  }",

  "    res = await runAttempt(py, code);",

  "    var top = mod.split('.')[0];",
  "    var pkg = PACKAGE_ALIASES[top] || top;",
  "    if (tried[pkg]) break;",

  "    try {",
  "      await py.loadPackage(pkg);",
  "      notes.push('Auto-loaded the ' + pkg + ' package (browser Python ships it separately) and re-ran your code.');",

  "  res.note = notes.join(' ');",

  "}",
  "onmessage = function(e) {",
  "  var code = e.data.code;",
  "  ensurePyodide().then(function(py) {",

  "};"
].join('\n');

var jsWorkerSrc = [

// A reusable worker slot: the worker stays alive between runs for speed, and
// is destroyed + recreated only when a timeout kills it.
function makeRunner(workerSrc, timeoutMs, label) {
  var worker = null;
  function getWorker() {
    if (!worker) {
      worker = new Worker(URL.createObjectURL(new Blob([workerSrc], { type: 'text/javascript' })));
    }
    return worker;
  }
  return function run(code) {
    return new Promise(function(resolve, reject) {
      var w;
      try { w = getWorker(); } catch (e) {
        reject(new Error(label + ' could not start: ' + (e.message || e)));
        return;
      }
      var done = false;
      var timer = setTimeout(function() {
        if (done) return;
        done = true;
        try { w.terminate(); } catch (e) {}
        worker = null; // timed-out worker is dead; next run gets a fresh one
        reject(new Error(label + ' timed out after ' + (timeoutMs / 1000) + 's and was stopped'));
      }, timeoutMs);
      function cleanup() {
        clearTimeout(timer);
        w.removeEventListener('message', onMsg);
        w.removeEventListener('error', onErr);
      }
      function onMsg(e) {
        if (done) return;
        done = true;
        cleanup();
        resolve(e.data);
      }
      function onErr(e) {
        if (done) return;
        done = true;
        cleanup();
        reject(new Error(label + ' crashed: ' + ((e && e.message) || 'worker error')));
      }
      w.addEventListener('message', onMsg);
      w.addEventListener('error', onErr);
      try { w.postMessage({ code: code }); }
      catch (e) {
        if (done) return;
        done = true;
        cleanup();
        reject(new Error(label + ' could not receive code: ' + (e.message || e)));
      }
    });
  };
}

var runPython = makeRunner(pythonWorkerSrc, PYTHON_TIMEOUT_MS, 'Python run');
var runJs = makeRunner(jsWorkerSrc, JS_TIMEOUT_MS, 'JavaScript run');
var pythonRuntimeReady = false;

// Runs a promise with a timeout (used for network calls, where aborting is safe).
function withTimeout(promise, ms, label) {
  var timer;
  var timeout = new Promise(function(_, reject) {
    timer = setTimeout(function() { reject(new Error(label + ' timed out after ' + (ms / 1000) + 's')); }, ms);
  });
  return Promise.race([promise, timeout]).then(
    function(v) { clearTimeout(timer); return v; },
    function(e) { clearTimeout(timer); throw e; }
  );
}

function run() { execute(false); }

async function execute(isRetry) {
  var out = document.getElementById('out');
  var btn = document.getElementById('runBtn');
  var notesEl = document.getElementById('notes');
  var lang = document.getElementById('lang').value;
  var codeEl = document.getElementById('code');
  btn.disabled = true;
  try {
    if (!isRetry) {
      out.innerHTML = (lang === 'python' && !pythonRuntimeReady)
        ? 'Loading Python runtime (first run only)...'
        : 'Running...';
      notesEl.textContent = '';
    } else {
      out.innerHTML = 'Re-running fixed code...';
    }
    var res;
    try {
      res = (lang === 'python') ? await runPython(codeEl.value) : await runJs(codeEl.value);
      if (lang === 'python') pythonRuntimeReady = true;
    } catch (e) {
      // Worker-level failure: timeout kill, crash, or startup error.
      lastStderr = e.message || String(e);
      out.innerHTML = '<span class="err">' + esc(lastStderr) + '</span>';
      notesEl.innerHTML = /timed out/.test(lastStderr)
        ? 'The runaway code was killed. Fix the loop and run again.'
        : '';
      return;
    }
    var failed = !res.ok || !!res.error;
    lastStderr = res.ok ? (res.error || '') : (res.error || 'Unknown error');
    if (res.ok && !res.error) {
      out.innerHTML = res.output ? '<span class="ok">' + esc(res.output) + '</span>' : '(no output)';
    } else {
      out.innerHTML = (res.output ? '<span class="ok">' + esc(res.output) + '</span>\n' : '') +
        '<span class="err">' + esc(lastStderr) + '</span>';
    }
    if (res.note && !failed && !isRetry) {
      notesEl.innerHTML = esc(res.note);
    }
    // Automatic fix: on failure, try rule-based repair first, then free AI, then re-run once.
    if (failed && !isRetry) {
      var fixed = (lang === 'python') ? autofixPython(codeEl.value, lastStderr) : autofixJs(codeEl.value, lastStderr);
      if (fixed.changed) {
        codeEl.value = fixed.code;
        notesEl.innerHTML = '<b>Auto-fixed and re-running:</b><br>' + fixed.notes.map(function(n){ return '&bull; ' + esc(n); }).join('<br>');
        await execute(true);
        return;
      }
      notesEl.innerHTML = '<b>AI is fixing the error...</b>';
      try {
        var aiCode = await aiFix(codeEl.value, lastStderr, lang, function(msg) { notesEl.innerHTML = '<b>' + esc(msg) + '</b>'; });
        if (aiCode && aiCode.trim() && aiCode.trim() !== codeEl.value.trim()) {
          codeEl.value = aiCode;
          notesEl.innerHTML = '<b>AI fixed it, re-running...</b>';
          await execute(true);
          return;
        }
        notesEl.innerHTML = '<b>AI could not fix it.</b><br>' + fixed.notes.map(function(n){ return '&bull; ' + esc(n); }).join('<br>');
      } catch (e) {
        // Surface the REAL reason instead of a generic message.
        notesEl.innerHTML = '<b>AI fix failed:</b> ' + esc(e.message || String(e)) + '<br>' +
          fixed.notes.map(function(n){ return '&bull; ' + esc(n); }).join('<br>') + explainHtml(codeEl.value, lastStderr, lang);
      }
    }
  } finally {
    btn.disabled = false; // always re-enable, even if something throws
  }
}

// ---------------------------------------------------------------------------
// Free AI code fixer (Pollinations, no key needed).
// What is actually true of the free service (measured live, Oct 29):
// - POST https://text.pollinations.ai/openai works, CORS open, real answers.
// - The anonymous tier allows about 1 reply every 30 seconds PER IP. Calls
//   inside that window get HTTP 402 with a FREE_LIMIT body ("Retry after
//   Ns"). It is a rate limit, not a hard paywall: wait out the window and
//   the next call works.
// - The old GET fallback (whole prompt in the URL) returns HTTP 404 for
//   any realistic prompt because the URL gets too long. It is only tried
//   when the prompt is short enough to have a chance.
// Chain: POST (openai) -> on 402, wait out the limit -> POST (openai-fast)
// -> on 402 again, wait once more -> POST (openai) -> GET (short prompts
// only). Every attempt's real result is reported. If the service still
// does not answer, the caller shows built-in guidance (explainError).
// ---------------------------------------------------------------------------
function cleanAiCode(text) {
  return text.replace(/^```[\w]*\n?/, '').replace(/\n?```$/, '').trim();
}

function sleepMs(ms) { return new Promise(function(res) { setTimeout(res, ms); }); }

async function aiFix(code, stderr, lang, onStatus) {
  var envNote = lang === 'python'
    ? '\n\nENVIRONMENT: this code runs in a browser via Pyodide (Python inside a web page). Facts: (1) The standard library works, and packages Pyodide ships separately (like sqlite3) are loaded automatically by the runner, so keep those imports as they are. (2) requests and urllib.request DO work for http/https through the browser network. A request can still fail if the target site refuses web-page requests (CORS) - that is a site restriction, not a code bug, and cannot be fixed by editing the code. (3) There is NO pip and NO micropip for arbitrary third-party packages; if the code imports a package outside the standard library that Pyodide does not ship, rewrite that part with the standard library only. (4) input() does not work; hardcode values instead. (5) There is no real file system; keep data in memory or io.StringIO. Never suggest pip install or micropip.'
    : '\n\nENVIRONMENT: this code runs in a browser sandbox. No Node.js APIs, no require(), no file system access. Use only standard browser JavaScript.';
  var prompt = 'Fix this ' + lang + ' code. It produced this error:\n' +
    stderr.slice(0, 2000) + '\n\nCode:\n' + code.slice(0, 4000) + envNote +
    '\n\nReturn ONLY the complete fixed code. No explanations, no markdown fences, no extra text.';
  var errors = [];
  function status(msg) { if (onStatus) { try { onStatus(msg); } catch (e) {} } }
  async function postOnce(model, label) {
    var r = await withTimeout(fetch('https://text.pollinations.ai/openai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: model,
        messages: [{ role: 'user', content: prompt }],
        max_tokens: 2000
      })
    }), 60000, label);
    if (!r.ok) {
      var body = '';
      try { body = await r.text(); } catch (e) {}
      var err = new Error('AI service returned HTTP ' + r.status);
      err.status = r.status;
      var rm = body.match(/retry after (\d+)\s*s/i);
      if (rm) err.retryAfter = parseInt(rm[1], 10);
      if (/FREE_LIMIT|free limit/i.test(body)) err.freeLimit = true;
      throw err;
    }
    var data = await r.json();
    var text = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if (!text || !text.trim()) throw new Error('AI returned an empty response');
    return cleanAiCode(text);
  }
  async function waitOutLimit(err) {
    var secs = err && err.retryAfter ? err.retryAfter + 2 : 32;
    if (secs < 15) secs = 15;
    if (secs > 45) secs = 45;
    for (var s = secs; s > 0; s--) {
      status('AI fix: the free AI service allows about 1 reply every 30 seconds per address, and this address just used one (that is the HTTP 402 you may have seen). Waiting ' + s + 's, then trying again...');
      await sleepMs(1000);
    }
    status('AI fix: trying the AI again...');
  }
  // Attempt 1: POST, main model.
  var lastErr = null;
  try { return await postOnce('openai', 'AI fix'); }
  catch (e) { errors.push('POST: ' + (e.message || e)); lastErr = e; }
  // Attempt 2: second model. Wait out the free limit first if that was it.
  if (lastErr && (lastErr.status === 402 || lastErr.freeLimit)) { await waitOutLimit(lastErr); }
  else { await sleepMs(1500); }
  try { return await postOnce('openai-fast', 'AI fix (second model)'); }
  catch (e2) { errors.push('POST 2: ' + (e2.message || e2)); lastErr = e2; }
  // Attempt 3: the limit bit again -> one more wait, one last POST.
  if (lastErr && (lastErr.status === 402 || lastErr.freeLimit)) {
    await waitOutLimit(lastErr);
    try { return await postOnce('openai', 'AI fix (final try)'); }
    catch (e3) { errors.push('POST 3: ' + (e3.message || e3)); }
  }
  // Attempt 4: GET endpoint, only when the URL is short enough to work.
  var getUrl = 'https://text.pollinations.ai/' + encodeURIComponent(prompt);
  if (getUrl.length <= 1800) {
    try {
      var r2 = await withTimeout(fetch(getUrl, { method: 'GET' }), 60000, 'AI fix fallback');
      if (!r2.ok) throw new Error('AI service returned HTTP ' + r2.status);
      var text2 = (await r2.text()).trim();
      if (!text2) throw new Error('AI returned an empty response');
      return cleanAiCode(text2);
    } catch (e4) { errors.push('GET: ' + (e4.message || e4)); }
  } else {
    errors.push('GET: skipped (prompt too long for the GET endpoint; it answers 404 for long prompts)');
  }
  throw new Error(errors.join(' | ') + ' - the free AI service did not answer. Built-in guidance for this error is shown below.');
}

// ---------------------------------------------------------------------------
// Built-in error explainer. No network, no AI service: it pattern-matches
// the error text and always returns plain-language cause + likely fix, so
// the Fix button never dead-ends on a raw provider error again. Shown
// whenever the AI service cannot be reached.
// ---------------------------------------------------------------------------
function explainError(code, stderr, lang) {
  var lines = [];
  function add(cause, fix) { lines.push('What happened: ' + cause); lines.push('Likely fix: ' + fix); }
  var m;
  if (lang === 'python') {
    var reqNames = null;
    var reqMatches = stderr.match(/the following arguments are required: ([^\n]+)/g);
    if (reqMatches && reqMatches.length) {
      // The traceback also quotes argparse's own source line containing a
      // format string; the real one names actual flags (starts with -).
      for (var ri = reqMatches.length - 1; ri >= 0; ri--) {
        var cand = reqMatches[ri].replace(/^the following arguments are required: /, '').trim();
        if (/^-/.test(cand) && !/%/.test(cand)) { reqNames = cand; break; }
      }
    }
    if (reqNames || (/argparse/.test(stderr) && /SystemExit/.test(stderr))) {
      add('the program uses argparse and quit because a required command-line argument was not given' + (reqNames ? ' (' + reqNames + ')' : '') + '. argparse prints its usage message and exits with code 2, which Python shows as SystemExit: 2. A web page cannot receive command-line flags, so parse_args() finds no arguments and stops the program before the real code runs.',
        'give the argument a default instead of requiring it, for example add_argument("--input", default="some-value"), or drop argparse and set the values as plain variables at the top of the script. The rest of the code then runs here unchanged.');
    } else if (/SystemExit/.test(stderr)) {
      add('the program stopped on purpose: something called sys.exit() (or exit()), and Python reports that as SystemExit. It is an intentional stop, not a crash.',
        'find the sys.exit() call or the condition that triggers it and check whether that condition is true by mistake. In this browser runner it is often argparse (see above) or a check for arguments or files that a web page cannot provide.');
    }
    m = stderr.match(/ModuleNotFoundError: No module named '([^']+)'/);
    if (m) {
      add("the code imports a module called '" + m[1] + "' that is not available here. Browser Python (Pyodide) can load the standard library and the separate packages it ships (like sqlite3, which this runner loads automatically), but it cannot pip install new ones.",
        "check the spelling first. If '" + m[1] + "' is a third-party package, rewrite that part with the standard library (json, re, math, random, datetime, collections, itertools, hashlib, base64 cover most jobs). If it is your own file, paste its code into the same script above the import.");
    }
    m = stderr.match(/NameError: name '([^']+)' is not defined/);
    if (m) {
      add("the code uses a name, '" + m[1] + "', that was never defined before that line. Usual causes: a typo, a missing import, or the line that defines it runs later (or sits inside a branch that did not run).",
        "check the spelling of '" + m[1] + "' everywhere. If it is a module, add the import at the top (import " + m[1] + "). If it is a variable or function, define it before the line that uses it.");
    }
    if (/IndentationError/.test(stderr)) {
      add('Python reads blocks by indentation, and one line is indented differently from what Python expected (often a line after an if/for/def line that is not indented, an extra indent, or tabs mixed with spaces).',
        'line up the block: lines inside if/for/while/def/with/try should share the same indent, 4 spaces per level, spaces only (no tab characters). The line number in the error is where to look first; the real problem is sometimes the line just above it.');
    }
    if (/SyntaxError/.test(stderr) && !/IndentationError/.test(stderr)) {
      add('Python could not parse the code at all: the flagged line is not valid Python. Common causes are a missing colon at the end of an if/for/def line, an unclosed bracket or quote, or a stray character.',
        'look at the flagged line and the one just above it. Check for a missing colon (:) after if/elif/else/for/while/def/class/try/except, and that every (, [, { and quote opened on the line is closed.');
    }
    m = stderr.match(/TypeError: ([^\n]+)/);
    if (m) {
      add('an operation got a value of the wrong type (' + m[1].trim() + '). Classic cases: adding a string to a number, calling something that is not a function, or passing the wrong number of arguments.',
        'print the values (and type(x)) just before the failing line to see what you actually have. Convert explicitly where needed (int(), str(), list()), and check the failing function is being called with the arguments it expects.');
    }
    if (/EOFError|StdinNotImplementedError/.test(stderr) || /input\(\)/.test(code) && /EOF/.test(stderr)) {
      add('the code called input(), which cannot work in a browser page: there is no keyboard console attached, so Python gives up with an EOF error.',
        'replace input(...) with a hardcoded value, for example name = "Jay" instead of name = input("Name? ").');
    }
    m = stderr.match(/ValueError: ([^\n]+)/);
    if (m) {
      add('a function got a value of the right type but an unusable content (' + m[1].trim() + '), for example int("abc") or unpacking the wrong number of items.',
        'print the value just before the failing line and check its actual content and shape, then convert or split it the way the function expects.');
    }
    if (/IndexError/.test(stderr)) {
      add('the code asked for a position in a list or string that does not exist (index too big, or the list is empty).',
        'print len(the_list) and the index being used just before the failing line; guard with if index < len(the_list) when the data can vary.');
    }
    m = stderr.match(/KeyError: ([^\n]+)/);
    if (m) {
      add('the code looked up a dictionary key that is not in the dictionary (' + m[1].trim() + ').',
        'check the spelling of the key, print the dictionary (or its .keys()) before the lookup, or use dict.get(key, default) when the key may legitimately be missing.');
    }
    if (/ZeroDivisionError/.test(stderr)) {
      add('the code divided by zero, which Python refuses.',
        'check the divisor just before the failing line; if it can be zero, guard it (if divisor != 0) or give it a sensible default.');
    }
  } else {
    m = stderr.match(/ReferenceError: (\w+) is not defined/) || stderr.match(/(\w+) is not defined/);
    if (m) {
      add("the code uses a name, '" + m[1] + "', that was never declared. Usual causes: a typo, or the let/const/var or function definition runs after the line that uses it.",
        "check the spelling of '" + m[1] + "' everywhere, and declare it (let " + m[1] + " = ...) before the line that uses it.");
    }
    m = stderr.match(/TypeError: ([^\n]+)/);
    if (m) {
      add('an operation got a value of the wrong kind (' + m[1].trim() + '), for example reading a property of undefined/null, or calling something that is not a function.',
        'console.log the value just before the failing line to see what it really is; check for undefined/null and that the thing being called is actually a function.');
    }
    if (/SyntaxError/.test(stderr)) {
      add('the browser could not parse the JavaScript: something on the flagged line is not valid syntax, often an unclosed bracket, brace or quote, or a stray character.',
        'count the opening and closing (), [] and {} around the flagged line and check quotes are closed; the real problem is often on the line just above.');
    }
  }
  if (!lines.length) lines.push('What happened: the error type and the line number at the end of the traceback point at the problem. Read the last line of the error first; it names the error and usually the exact value or name involved.');
  return lines;
}

function explainHtml(code, stderr, lang) {
  return '<br><b>Built-in guidance</b> (always available, no AI service needed):<br>' +
    explainError(code, stderr, lang).map(function(n) { return '&bull; ' + esc(n); }).join('<br>');
}

async function autofix() {
  var notes = document.getElementById('notes');
  var lang = document.getElementById('lang').value;
  var codeEl = document.getElementById('code');
  notes.innerHTML = '<b>Analyzing...</b>';
  var fixed = (lang === 'python') ? autofixPython(codeEl.value, lastStderr) : autofixJs(codeEl.value, lastStderr);
  if (fixed.changed) {
    codeEl.value = fixed.code;
    notes.innerHTML = fixed.notes.map(function(n){ return '&bull; ' + esc(n); }).join('<br>') + '<br><b>Code updated. Hit Run to test the fix.</b>';
    return;
  }
  notes.innerHTML = '<b>AI is fixing the error...</b>';
  try {
    var aiCode = await aiFix(codeEl.value, lastStderr, lang, function(msg) { notes.innerHTML = '<b>' + esc(msg) + '</b>'; });
    if (aiCode && aiCode.trim() && aiCode.trim() !== codeEl.value.trim()) {
      codeEl.value = aiCode;
      notes.innerHTML = '<b>AI fixed it. Hit Run to test.</b>';
    } else {
      notes.innerHTML = '<b>AI could not fix it.</b><br>' + fixed.notes.map(function(n){ return '&bull; ' + esc(n); }).join('<br>');
    }
  } catch (e) {
    notes.innerHTML = '<b>AI fix failed:</b> ' + esc(e.message || String(e)) + '<br>' +
      fixed.notes.map(function(n){ return '&bull; ' + esc(n); }).join('<br>') + explainHtml(codeEl.value, lastStderr, lang);
  }
}

function autofixPython(code, stderr) {
  var notes = [];
  var lines = code.split('\n');
  var m = stderr.match(/ModuleNotFoundError: No module named '([^']+)'/);
  if (m) {
    if (m[1] === 'requests') {
      notes.push("'requests' works in this runner through a built-in browser bridge, so this error should not normally appear. If it does, run the code again.");
    } else {
      notes.push("Missing module '" + m[1] + "'. Packages that browser Python ships separately (like sqlite3) are loaded automatically by the runner. This one could not be loaded, and browser Python can't pip install; stick to built-in modules (json, re, math, random, datetime, collections, itertools, hashlib, base64) or rewrite without it.");
    }
  }
  if (/EOFError|StdinNotImplementedError/i.test(stderr) || (/input\(\)/.test(code) && /EOF/.test(stderr))) {
    notes.push('input() does not work in the browser. Hardcode the value instead of reading input.');
  }
  m = stderr.match(/NameError: name '(\w+)' is not defined/);
  if (m && ['json','re','os','sys','math','time','random','datetime','collections','itertools','functools','hashlib','base64'].indexOf(m[1]) !== -1) {
    if (!new RegExp('^import\\s+' + m[1] + '\\b', 'm').test(code)) {
      lines.unshift('import ' + m[1]);
      notes.push("Added missing 'import " + m[1] + "'");
    }
  }
  // Find the user's code line: last <exec> frame in the traceback, else last "line N" anywhere
  var errLine = null;
  var execFrames = stderr.match(/File "<exec>", line (\d+)/g) || [];
  if (execFrames.length) {
    errLine = parseInt(execFrames[execFrames.length - 1].match(/line (\d+)/)[1], 10);
  } else {
    var allLines = stderr.match(/line (\d+)/g) || [];
    if (allLines.length) errLine = parseInt(allLines[allLines.length - 1].match(/line (\d+)/)[1], 10);
  }
  if (/IndentationError: unexpected indent/.test(stderr) && errLine && errLine <= lines.length) {
    var i = errLine - 1;
    var stripped = lines[i].replace(/^\s+/, '');
    var prev = '';
    for (var j = i - 1; j >= 0; j--) {
      if (lines[j].trim()) { prev = lines[j].match(/^\s*/)[0]; break; }
    }
    lines[i] = prev + stripped;
    notes.push('Fixed unexpected indent on line ' + errLine);
  }
  if (/TabError/.test(stderr)) { lines = lines.map(function(l){ return l.replace(/\t/g, '    '); }); notes.push('Converted tabs to 4 spaces'); }
  if (/SyntaxError/.test(stderr) && errLine && errLine <= lines.length) {
    var k = errLine - 1;
    var s = lines[k].replace(/\s+$/, '');
    if (/^\s*(if|elif|else|for|while|def|class|try|except|finally|with)\b/.test(s) && !/:$/.test(s)) {
      lines[k] = s + ':';
      notes.push('Added missing colon on line ' + errLine);
    }
  }
  var fixed = lines.join('\n');
  if (fixed === code && !notes.length) notes.push('No automatic fix found. The error type and line number point at the problem.');
  return { code: fixed, notes: notes, changed: fixed !== code };
}

function autofixJs(code, stderr) {
  var notes = [];
  var m = stderr.match(/SyntaxError: Unexpected token '([^']+)'/);
  if (m) notes.push("Syntax error near '" + m[1] + "'. Check for unclosed brackets, quotes, or a typo on that line.");
  m = stderr.match(/(\w+) is not defined/);
  if (m) notes.push("'" + m[1] + "' is not defined. Check the spelling or declare it first.");
  m = stderr.match(/TypeError: ([^\n]+)/);
  if (m) notes.push('Type error: ' + m[1] + '. Check that values are the type the code expects.');
  if (!notes.length) notes.push('No automatic fix found. The error message and line number point at the problem.');
  return { code: code, notes: notes, changed: false };
}

function downloadCode() {
  var lang = document.getElementById('lang').value;
  var code = document.getElementById('code').value;
  var blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (lang === 'python') ? 'code.py' : 'code.js';
  document.body.appendChild(a);
  a.click();
  setTimeout(function() { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}

function clearAll() {
  document.getElementById('code').value = '';
  document.getElementById('out').textContent = 'Output appears here.';
  document.getElementById('notes').textContent = '';
  lastStderr = '';
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
document.getElementById('lang').addEventListener('change', function(e) {
  document.getElementById('code').placeholder = e.target.value === 'python' ? "print('hello world')" : "console.log('hello world');";
});
