<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Runner</title>
<style>
  body { background:#0f172a; color:#e2e8f0; font-family:system-ui,sans-serif; margin:0; padding:20px; }
  main { max-width:900px; margin:0 auto; }
  h1 { color:#fff; margin-bottom:4px; }
  .sub { color:#64748b; font-size:14px; margin-bottom:16px; }
  .row { display:flex; gap:12px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  select { background:#1e293b; color:#e2e8f0; border:1px solid #334155; border-radius:8px; padding:10px 14px; font-size:15px; }
  button { background:#22d3ee; color:#0b1220; border:0; border-radius:8px; padding:10px 24px;
    font-size:15px; font-weight:700; cursor:pointer; }
  button.ghost { background:#1e293b; color:#22d3ee; border:1px solid #334155; }
  button:disabled { opacity:.5; }
  textarea { width:100%; height:320px; background:#0b1220; color:#e2e8f0; border:1px solid #334155;
    border-radius:8px; padding:14px; font-family:monospace; font-size:14px; box-sizing:border-box; resize:vertical; }
  #out { margin-top:16px; background:#0b1220; border:1px solid #334155; border-radius:8px; padding:16px;
    white-space:pre-wrap; word-break:break-word; font-family:monospace; font-size:13px; min-height:80px; }
  #notes { margin-top:12px; color:#a78bfa; font-size:14px; }
  .err { color:#f87171; } .ok { color:#4ade80; }
</style>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
</head>
<body>
<main>
  <h1>Code Runner</h1>
  <div class="sub">Run Python or JavaScript right in your browser. Auto-fix cleans up common errors.</div>
  <div class="row">
    <select id="lang">
      <option value="python">Python</option>
      <option value="javascript">JavaScript</option>
    </select>
    <button id="runBtn" onclick="run()">Run</button>
    <button id="fixBtn" class="ghost" onclick="autofix()">Auto-fix errors</button>
    <button class="ghost" onclick="clearAll()">Clear</button>
  </div>
  <textarea id="code" spellcheck="false" placeholder="print('hello world')"></textarea>
  <div id="notes"></div>
  <div id="out">Output appears here.</div>
</main>
<script>
let lastStderr = '';
let pyodide = null;

async function getPyodide() {
  if (!pyodide) {
    document.getElementById('out').textContent = 'Loading Python runtime (first run only)...';
    pyodide = await loadPyodide();
  }
  return pyodide;
}

async function run() {
  const out = document.getElementById('out');
  const btn = document.getElementById('runBtn');
  const lang = document.getElementById('lang').value;
  const code = document.getElementById('code').value;
  btn.disabled = true;
  out.innerHTML = 'Running...';
  document.getElementById('notes').textContent = '';
  try {
    if (lang === 'python') {
      const py = await getPyodide();
      let stdout = '', stderr = '';
      py.setStdout({ batched: s => { stdout += s + '\n'; } });
      py.setStderr({ batched: s => { stderr += s + '\n'; } });
      try {
        await py.runPythonAsync(code);
        lastStderr = stderr;
        out.innerHTML = (stdout ? '<span class="ok">' + esc(stdout) + '</span>' : '') +
          (stderr ? '<span class="err">' + esc(stderr) + '</span>' : '') || '(no output)';
      } catch (e) {
        lastStderr = String(e.message || e);
        out.innerHTML = '<span class="err">' + esc(lastStderr) + '</span>';
      }
    } else {
      const logs = [];
      const fakeConsole = { log: (...a) => logs.push(a.map(String).join(' ')),
        error: (...a) => logs.push(a.map(String).join(' ')),
        warn: (...a) => logs.push(a.map(String).join(' ')) };
      try {
        const fn = new (Object.getPrototypeOf(async function(){}).constructor)('console', code);
        await fn(fakeConsole);
        lastStderr = '';
        out.innerHTML = logs.length ? '<span class="ok">' + esc(logs.join('\n')) + '</span>' : '(no output)';
      } catch (e) {
        lastStderr = String((e && e.stack) || e);
        out.innerHTML = (logs.length ? '<span class="ok">' + esc(logs.join('\n')) + '</span>\n' : '') +
          '<span class="err">' + esc(lastStderr) + '</span>';
      }
    }
  } catch(e) { out.innerHTML = '<span class="err">Error: ' + esc(e.message) + '</span>'; }
  btn.disabled = false;
}

function autofix() {
  const notes = document.getElementById('notes');
  const lang = document.getElementById('lang').value;
  const codeEl = document.getElementById('code');
  notes.textContent = 'Analyzing...';
  const fixed = lang === 'python' ? autofixPython(codeEl.value, lastStderr) : autofixJs(codeEl.value, lastStderr);
  if (fixed.changed) {
    codeEl.value = fixed.code;
    notes.innerHTML = fixed.notes.map(n => '&bull; ' + esc(n)).join('<br>') + '<br><b>Code updated. Hit Run to test the fix.</b>';
  } else {
    notes.innerHTML = fixed.notes.map(n => '&bull; ' + esc(n)).join('<br>');
  }
}

function autofixPython(code, stderr) {
  const notes = [];
  let lines = code.split('\n');
  let m = stderr.match(/ModuleNotFoundError: No module named '([^']+)'/);
  if (m) notes.push(`Missing module '${m[1]}'. Browser Python can't pip install; stick to built-in modules (json, re, math, random, datetime).`);
  m = stderr.match(/NameError: name '(\w+)' is not defined/);
  if (m && ['json','re','os','sys','math','time','random','datetime'].includes(m[1])) {
    if (!new RegExp(`^import\\s+${m[1]}\\b`, 'm').test(code)) {
      lines.unshift(`import ${m[1]}`);
      notes.push(`Added missing 'import ${m[1]}'`);
    }
  }
  m = stderr.match(/File "<exec>", line (\d+)/) || stderr.match(/line (\d+)/);
  const errLine = m ? parseInt(m[1]) : null;
  if (/IndentationError: unexpected indent/.test(stderr) && errLine && errLine <= lines.length) {
    const i = errLine - 1;
    const stripped = lines[i].trimStart();
    let prev = '';
    for (let j = i - 1; j >= 0; j--) {
      if (lines[j].trim()) { prev = lines[j].match(/^\s*/)[0]; break; }
    }
    lines[i] = prev + stripped;
    notes.push(`Fixed unexpected indent on line ${errLine}`);
  }
  if (/TabError/.test(stderr)) { lines = lines.map(l => l.replace(/\t/g, '    ')); notes.push('Converted tabs to 4 spaces'); }
  if (/SyntaxError/.test(stderr) && errLine && errLine <= lines.length) {
    const i = errLine - 1;
    const s = lines[i].trimEnd();
    if (/^\s*(if|elif|else|for|while|def|class|try|except|finally|with)\b/.test(s) && !s.endsWith(':')) {
      lines[i] = s + ':';
      notes.push(`Added missing colon on line ${errLine}`);
    }
  }
  const fixed = lines.join('\n');
  if (fixed === code && !notes.length) notes.push('No automatic fix found. The error type and line number point at the problem.');
  return { code: fixed, notes, changed: fixed !== code };
}

function autofixJs(code, stderr) {
  const notes = [];
  let m = stderr.match(/SyntaxError: Unexpected token '([^']+)'/);
  if (m) notes.push(`Syntax error near '${m[1]}'. Check for unclosed brackets, quotes, or a typo on that line.`);
  m = stderr.match(/(\w+) is not defined/);
  if (m) notes.push(`'${m[1]}' is not defined. Check the spelling or declare it first.`);
  m = stderr.match(/TypeError: ([^\n]+)/);
  if (m) notes.push(`Type error: ${m[1]}. Check that values are the type the code expects.`);
  if (!notes.length) notes.push('No automatic fix found. The error message and line number point at the problem.');
  return { code, notes, changed: false };
}

function clearAll() {
  document.getElementById('code').value = '';
  document.getElementById('out').textContent = 'Output appears here.';
  document.getElementById('notes').textContent = '';
  lastStderr = '';
}
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
document.getElementById('lang').addEventListener('change', e => {
  document.getElementById('code').placeholder = e.target.value === 'python' ? "print('hello world')" : "console.log('hello world');";
});
</script>
</body>
</html>
